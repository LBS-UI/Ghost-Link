<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghost Link — Location Sharing</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #1a1a22;
      --border: #2e2e3a;
      --text: #e8e8f0;
      --muted: #8a8a9a;
      --accent: #6c5ce7;
      --accent-hover: #7d6ff0;
      --success: #00d26a;
      --warning: #ffb800;
      --danger: #ff4757;
      --sharing: #00b4d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; background: #1a1a22; }

    .panel {
      position: absolute;
      z-index: 1000;
      background: rgba(26, 26, 34, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #status-bar {
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      font-size: 14px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15,15,18,0.7);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.sharing { background: var(--sharing); box-shadow: 0 0 8px var(--sharing); animation: pulse 1.5s infinite; }
    .dot.paused { background: var(--warning); }
    .dot.error { background: var(--danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    #controls {
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(440px, calc(100% - 32px));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h1 { font-size: 18px; font-weight: 600; }
    .controls-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button.share-btn {
      flex: 1;
      min-width: 80px;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.share-btn:hover { background: #252530; }
    button.share-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: white; border-color: transparent; }
    button.primary:hover { background: var(--accent-hover); }
    button.danger { background: var(--danger); color: white; border-color: transparent; }
    button.warning { background: var(--warning); color: #111; border-color: transparent; }
    .info { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4; }
    #message { min-height: 18px; font-size: 12px; text-align: center; color: var(--warning); }
    #share-link {
      display: none;
      background: rgba(15,15,18,0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      word-break: break-all;
      color: var(--accent);
      cursor: pointer;
    }
    #share-link:hover { background: rgba(108,92,231,0.15); }

    .search-wrap {
      position: absolute;
      top: 70px;
      left: 16px;
      z-index: 1000;
      width: 360px;
      max-width: calc(100vw - 32px);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 14px;
      background: rgba(26, 26, 34, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .search-box input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      font-size: 15px; color: var(--text); font-family: inherit;
    }
    .search-box input::placeholder { color: var(--muted); }
    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; padding: 0; border: none; background: transparent;
      border-radius: 50%; cursor: pointer; color: var(--muted);
    }
    .icon-btn:hover { background: rgba(255,255,255,0.08); }
    .icon-btn.hidden { display: none; }
    .results {
      display: none; margin-top: 8px;
      background: rgba(26, 26, 34, 0.95); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-height: 50vh; overflow-y: auto;
    }
    .results.open { display: block; }
    .result-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 11px 16px; cursor: pointer; border-bottom: 1px solid var(--border);
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: rgba(255,255,255,0.05); }
    .result-title { font-size: 14px; color: var(--text); }
    .result-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .result-empty { padding: 14px 16px; font-size: 14px; color: var(--muted); }

    .layers-wrap { position: absolute; top: 70px; right: 16px; z-index: 1000; }
    .layers-btn {
      display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px;
      background: rgba(26, 26, 34, 0.95); border: 1px solid var(--border);
      border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 500;
      color: var(--text); cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .layers-btn:hover { background: #252530; }
    .layers-panel {
      display: none; position: absolute; top: 48px; right: 0; width: 160px; padding: 8px;
      background: rgba(26, 26, 34, 0.95); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .layers-panel.open { display: block; }
    .layers-panel label {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px;
      border-radius: 8px; font-size: 14px; color: var(--text); cursor: pointer;
    }
    .layers-panel label:hover { background: rgba(255,255,255,0.05); }
    .layers-panel input { accent-color: var(--accent); cursor: pointer; }

    .map-controls {
      position: absolute; right: 16px; bottom: 200px; z-index: 1000;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .round-btn {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; background: rgba(26, 26, 34, 0.95);
      border: 1px solid var(--border); border-radius: 50%; cursor: pointer;
      color: var(--text); box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .round-btn:hover { background: #252530; }
    .zoom-group {
      display: flex; flex-direction: column; background: rgba(26, 26, 34, 0.95);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .zoom-group button {
      width: 40px; height: 40px; border: none; background: transparent;
      font-size: 20px; color: var(--text); cursor: pointer;
    }
    .zoom-group button:hover { background: rgba(255,255,255,0.08); }
    .zoom-group button:first-child { border-bottom: 1px solid var(--border); }

    .leaflet-control-attribution {
      background: rgba(15,15,18,0.8) !important; color: var(--muted) !important; font-size: 11px !important;
    }
    .leaflet-control-attribution a { color: var(--accent); }
    .leaflet-popup-content-wrapper {
      background: #1a1a22; color: var(--text); border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: #1a1a22; }
    .popup-title { font-weight: 500; font-size: 15px; margin-bottom: 4px; }
    .popup-coords { font-size: 12px; color: var(--muted); }
    .gpin { filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }

    .viewer-banner {
      display: none; position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(0,180,216,0.9); color: white; padding: 8px 16px;
      border-radius: 20px; font-size: 14px; font-weight: 600;
    }
    body.viewer-mode #controls, body.viewer-mode .search-wrap, body.viewer-mode .layers-wrap,
    body.viewer-mode .map-controls { display: none; }
    body.viewer-mode .viewer-banner { display: block; }

    @media (max-width: 480px) {
      .search-wrap { width: calc(100vw - 32px); top: 64px; }
      .layers-wrap { top: 64px; }
      .map-controls { bottom: 180px; }
      #controls { bottom: 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="viewer-banner" id="viewer-banner">Viewing shared location</div>

  <div class="panel" id="status-bar">
    <div class="status-item">
      <div class="dot" id="net-dot"></div>
      <span id="net-status">Checking…</span>
    </div>
    <div class="status-item">
      <div class="dot" id="share-dot"></div>
      <span id="share-status">Not sharing</span>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input id="searchInput" type="text" placeholder="Search places" autocomplete="off" />
      <button class="icon-btn hidden" id="clearBtn" aria-label="Clear">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="results" id="results"></div>
  </div>

  <div class="layers-wrap">
    <button class="layers-btn" id="layersBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <polygon points="12 3 22 8.5 12 14 2 8.5 12 3"></polygon>
        <polyline points="2 15.5 12 21 22 15.5"></polyline>
      </svg>
      <span>Layers</span>
    </button>
    <div class="layers-panel" id="layersPanel">
      <label><input type="radio" name="layer" value="dark" checked /> Dark</label>
      <label><input type="radio" name="layer" value="streets" /> Streets</label>
      <label><input type="radio" name="layer" value="satellite" /> Satellite</label>
    </div>
  </div>

  <div class="map-controls">
    <button class="round-btn" id="locateBtn" title="Your location">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle>
        <line x1="12" y1="1" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="23"></line>
        <line x1="1" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="23" y2="12"></line>
      </svg>
    </button>
    <div class="zoom-group">
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
    </div>
  </div>

  <div class="panel" id="controls">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <h1>Ghost Link</h1>
    </div>
    <div class="controls-row">
      <button id="btn-start" class="share-btn primary">Start Sharing</button>
      <button id="btn-pause" class="share-btn warning" disabled>Pause</button>
      <button id="btn-resume" class="share-btn primary" disabled>Resume</button>
      <button id="btn-stop" class="share-btn danger" disabled>Stop</button>
    </div>
    <div id="share-link" title="Click to copy"></div>
    <div class="info">
      Real GPS only. Your location is shared only while sharing is active.<br>
      Click the link to copy it and send it to someone.
    </div>
    <div id="message"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // ============================================================
    // CONFIG — set this to your Cloudflare Worker URL after deploying
    // Example: 'https://ghost-link-api.your-subdomain.workers.dev'
    // Leave empty to run in local-only mode (no share links)
    // ============================================================
    const API_BASE = '';

    const map = L.map('map', {
      center: [40.7128, -74.0060],
      zoom: 13,
      zoomControl: false,
      attributionControl: true
    });

    const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19, subdomains: 'abcd'
    });
    const streetsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 20, subdomains: 'abcd'
    });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    });
    const baseLayers = { dark: darkLayer, streets: streetsLayer, satellite: satelliteLayer };
    darkLayer.addTo(map);

    const pinIcon = L.divIcon({
      className: 'gpin',
      html: `<svg width="28" height="40" viewBox="0 0 28 40"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.27 21.73 0 14 0z" fill="#6c5ce7"/><circle cx="14" cy="14" r="5.5" fill="#fff"/></svg>`,
      iconSize: [28, 40], iconAnchor: [14, 40], popupAnchor: [0, -34]
    });

    let searchMarker = null;
    let userMarker = L.circleMarker([40.7128, -74.0060], {
      radius: 10, fillColor: '#6c5ce7', color: '#fff', weight: 2, fillOpacity: 0.9
    }).addTo(map);
    userMarker.bindPopup('Your location');

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
    }

    // Search
    const searchInput = document.getElementById('searchInput');
    const resultsEl = document.getElementById('results');
    const clearBtn = document.getElementById('clearBtn');
    let debounceTimer = null, lastRequest = 0;

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim();
      clearBtn.classList.toggle('hidden', q.length === 0);
      clearTimeout(debounceTimer);
      if (q.length < 3) { closeResults(); return; }
      debounceTimer = setTimeout(() => runSearch(q), 420);
    });
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeResults(); searchInput.blur(); }
      if (e.key === 'Enter') { const first = resultsEl.querySelector('.result-item'); if (first) first.click(); }
    });
    clearBtn.addEventListener('click', () => { searchInput.value = ''; clearBtn.classList.add('hidden'); closeResults(); searchInput.focus(); });

    async function runSearch(query) {
      const now = Date.now();
      if (now - lastRequest < 1000) return;
      lastRequest = now;
      resultsEl.innerHTML = '<div class="result-empty">Searching…</div>';
      resultsEl.classList.add('open');
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&q=' + encodeURIComponent(query), { headers: { Accept: 'application/json' } });
        const data = await res.json();
        renderResults(data);
      } catch { resultsEl.innerHTML = '<div class="result-empty">Search unavailable.</div>'; resultsEl.classList.add('open'); }
    }
    function renderResults(data) {
      resultsEl.innerHTML = '';
      if (!data.length) { resultsEl.innerHTML = '<div class="result-empty">No results found</div>'; resultsEl.classList.add('open'); return; }
      data.forEach(place => {
        const parts = place.display_name.split(',');
        const title = parts[0].trim(), sub = parts.slice(1).join(',').trim();
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div><div class="result-title">${escapeHtml(title)}</div><div class="result-sub">${escapeHtml(sub)}</div></div>`;
        item.addEventListener('click', () => {
          map.flyTo([+place.lat, +place.lon], 16, { duration: 1.1 });
          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.marker([+place.lat, +place.lon], { icon: pinIcon }).addTo(map)
            .bindPopup(`<div class="popup-title">${escapeHtml(title)}</div><div class="popup-coords">${escapeHtml(sub)}</div>`).openPopup();
          searchInput.value = title; closeResults();
        });
        resultsEl.appendChild(item);
      });
      resultsEl.classList.add('open');
    }
    function closeResults() { resultsEl.classList.remove('open'); }
    document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) closeResults(); });

    map.on('click', e => {
      if (searchMarker) map.removeLayer(searchMarker);
      searchMarker = L.marker([e.latlng.lat, e.latlng.lng], { icon: pinIcon }).addTo(map)
        .bindPopup(`<div class="popup-title">Dropped pin</div><div class="popup-coords">${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}</div>`).openPopup();
    });

    document.getElementById('zoomIn').onclick = () => map.zoomIn();
    document.getElementById('zoomOut').onclick = () => map.zoomOut();

    const layersBtn = document.getElementById('layersBtn');
    const layersPanel = document.getElementById('layersPanel');
    layersBtn.onclick = e => { e.stopPropagation(); layersPanel.classList.toggle('open'); };
    document.addEventListener('click', e => { if (!e.target.closest('.layers-wrap')) layersPanel.classList.remove('open'); });
    document.querySelectorAll('input[name="layer"]').forEach(r => r.onchange = e => {
      Object.values(baseLayers).forEach(l => map.removeLayer(l));
      baseLayers[e.target.value].addTo(map);
      layersPanel.classList.remove('open');
    });

    document.getElementById('locateBtn').onclick = () => {
      if (!navigator.geolocation) { setMessage('Geolocation not supported.', 'error'); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        map.flyTo([lat, lng], 16, { duration: 1.2 });
        moveUserMarker(lat, lng);
        setMessage('Centered on your location.', 'success');
      }, () => setMessage('Location permission denied.', 'error'), { enableHighAccuracy: true, timeout: 10000 });
    };

    // Sharing state
    let watchId = null;
    let sharing = false;
    let paused = false;
    let shareId = null;
    let shareToken = null;
    let updateTimer = null;
    let viewerTimer = null;

    const netDot = document.getElementById('net-dot');
    const netStatus = document.getElementById('net-status');
    const shareDot = document.getElementById('share-dot');
    const shareStatus = document.getElementById('share-status');
    const messageEl = document.getElementById('message');
    const shareLinkEl = document.getElementById('share-link');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');
    const btnStop = document.getElementById('btn-stop');

    function setMessage(text, type = 'info') {
      messageEl.textContent = text;
      messageEl.style.color = type === 'error' ? 'var(--danger)' : type === 'success' ? 'var(--success)' : 'var(--warning)';
    }

    function updateNetworkStatus() {
      netDot.className = navigator.onLine ? 'dot online' : 'dot error';
      netStatus.textContent = navigator.onLine ? 'Online' : 'Offline';
      if (!navigator.onLine) setMessage('You are offline.', 'error');
    }
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);
    updateNetworkStatus();

    function updateShareUI() {
      if (!sharing) {
        shareDot.className = 'dot';
        shareStatus.textContent = 'Not sharing';
        btnStart.disabled = false; btnPause.disabled = true; btnResume.disabled = true; btnStop.disabled = true;
        shareLinkEl.style.display = 'none';
      } else if (paused) {
        shareDot.className = 'dot paused';
        shareStatus.textContent = 'Paused';
        btnStart.disabled = true; btnPause.disabled = true; btnResume.disabled = false; btnStop.disabled = false;
      } else {
        shareDot.className = 'dot sharing';
        shareStatus.textContent = 'Sharing (GPS)';
        btnStart.disabled = true; btnPause.disabled = false; btnResume.disabled = true; btnStop.disabled = false;
      }
    }

    function moveUserMarker(lat, lng) {
      userMarker.setLatLng([lat, lng]);
    }

    async function api(path, options = {}) {
      if (!API_BASE) throw new Error('API_BASE not set');
      const res = await fetch(API_BASE + path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function startShareSession() {
      if (!API_BASE) {
        setMessage('Share links disabled (set API_BASE in the code).', 'error');
        return null;
      }
      try {
        const data = await api('/api/share', { method: 'POST' });
        shareId = data.id;
        shareToken = data.token;
        const link = location.origin + location.pathname + '?view=' + shareId;
        shareLinkEl.textContent = link;
        shareLinkEl.style.display = 'block';
        shareLinkEl.onclick = () => {
          navigator.clipboard.writeText(link).then(() => setMessage('Link copied!', 'success')).catch(() => setMessage('Copy failed', 'error'));
        };
        setMessage('Share link ready. Click it to copy.', 'success');
        return data;
      } catch (err) {
        setMessage('Could not create share link: ' + err.message, 'error');
        return null;
      }
    }

    async function pushLocation(lat, lng) {
      if (!shareId || !shareToken || !API_BASE) return;
      try {
        await api('/api/share/' + shareId, {
          method: 'POST',
          body: JSON.stringify({ token: shareToken, lat, lng })
        });
      } catch (e) { console.warn('Location push failed', e); }
    }

    function startWatching() {
      if (!navigator.geolocation) { setMessage('Geolocation not supported.', 'error'); return; }
      watchId = navigator.geolocation.watchPosition(
        pos => {
          if (!sharing || paused) return;
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          moveUserMarker(lat, lng);
          map.panTo([lat, lng], { animate: true });
          pushLocation(lat, lng);
        },
        err => setMessage('GPS error: ' + err.message, 'error'),
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    }

    function stopWatching() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    }

    btnStart.onclick = async () => {
      sharing = true; paused = false;
      setMessage('Requesting location permission…');
      updateShareUI();
      await startShareSession();
      startWatching();
    };

    btnPause.onclick = () => {
      paused = true;
      setMessage('Sharing paused.');
      updateShareUI();
    };

    btnResume.onclick = () => {
      paused = false;
      setMessage('Sharing resumed.');
      updateShareUI();
    };

    btnStop.onclick = () => {
      sharing = false; paused = false;
      stopWatching();
      shareId = null; shareToken = null;
      shareLinkEl.style.display = 'none';
      setMessage('Sharing stopped. The link is no longer active.');
      updateShareUI();
    };

    // Viewer mode
    const params = new URLSearchParams(location.search);
    const viewId = params.get('view');
    if (viewId) {
      document.body.classList.add('viewer-mode');
      document.getElementById('viewer-banner').textContent = 'Viewing shared location';
      async function pollLocation() {
        if (!API_BASE) { setMessage('API not configured.', 'error'); return; }
        try {
          const data = await api('/api/share/' + viewId);
          if (data && data.lat != null) {
            moveUserMarker(data.lat, data.lng);
            map.setView([data.lat, data.lng], Math.max(map.getZoom(), 15));
            setMessage('Last update: ' + new Date(data.updated).toLocaleTimeString(), 'success');
          } else {
            setMessage('No location available yet.', 'error');
          }
        } catch (e) {
          setMessage('Share link not found or expired.', 'error');
        }
      }
      pollLocation();
      viewerTimer = setInterval(pollLocation, 4000);
    }

    updateShareUI();
    setMessage('Ready. Click Start Sharing to begin (real GPS).');
  </script>
</body>
</html>
