<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghost Link — Location Sharing</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #1a1a22;
      --border: #2e2e3a;
      --text: #e8e8f0;
      --muted: #8a8a9a;
      --accent: #6c5ce7;
      --accent-hover: #7d6ff0;
      --success: #00d26a;
      --warning: #ffb800;
      --danger: #ff4757;
      --sharing: #00b4d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; background: #1a1a22; }

    /* Status bar (Ghost Link) */
    .panel {
      position: absolute;
      z-index: 1000;
      background: rgba(26, 26, 34, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #status-bar {
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      font-size: 14px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15,15,18,0.7);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.sharing { background: var(--sharing); box-shadow: 0 0 8px var(--sharing); animation: pulse 1.5s infinite; }
    .dot.paused { background: var(--warning); }
    .dot.error { background: var(--danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Sharing controls (Ghost Link) */
    #controls {
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(420px, calc(100% - 32px));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h1 { font-size: 18px; font-weight: 600; }
    .controls-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button.share-btn {
      flex: 1;
      min-width: 80px;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.share-btn:hover { background: #252530; }
    button.share-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: white; border-color: transparent; }
    button.primary:hover { background: var(--accent-hover); }
    button.danger { background: var(--danger); color: white; border-color: transparent; }
    button.warning { background: var(--warning); color: #111; border-color: transparent; }
    .info { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4; }
    .demo-badge {
      display: inline-block;
      background: #2a1f3d;
      color: #c5a3ff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 6px;
      font-weight: 600;
    }
    #message { min-height: 18px; font-size: 12px; text-align: center; color: var(--warning); }

    /* Search bar (from provided map code, dark-adapted) */
    .search-wrap {
      position: absolute;
      top: 70px;
      left: 16px;
      z-index: 1000;
      width: 360px;
      max-width: calc(100vw - 32px);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 14px;
      background: rgba(26, 26, 34, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
    }
    .search-box input::placeholder { color: var(--muted); }
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      color: var(--muted);
    }
    .icon-btn:hover { background: rgba(255,255,255,0.08); }
    .icon-btn.hidden { display: none; }
    .results {
      display: none;
      margin-top: 8px;
      background: rgba(26, 26, 34, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-height: 50vh;
      overflow-y: auto;
    }
    .results.open { display: block; }
    .result-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: rgba(255,255,255,0.05); }
    .result-title { font-size: 14px; color: var(--text); }
    .result-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .result-empty { padding: 14px 16px; font-size: 14px; color: var(--muted); }

    /* Layers panel (dark-adapted) */
    .layers-wrap {
      position: absolute;
      top: 70px;
      right: 16px;
      z-index: 1000;
    }
    .layers-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px;
      background: rgba(26, 26, 34, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .layers-btn:hover { background: #252530; }
    .layers-panel {
      display: none;
      position: absolute;
      top: 48px;
      right: 0;
      width: 160px;
      padding: 8px;
      background: rgba(26, 26, 34, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .layers-panel.open { display: block; }
    .layers-panel label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
    }
    .layers-panel label:hover { background: rgba(255,255,255,0.05); }
    .layers-panel input { accent-color: var(--accent); cursor: pointer; }

    /* Map controls (zoom + locate) */
    .map-controls {
      position: absolute;
      right: 16px;
      bottom: 180px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .round-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: rgba(26, 26, 34, 0.95);
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      color: var(--text);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .round-btn:hover { background: #252530; }
    .zoom-group {
      display: flex;
      flex-direction: column;
      background: rgba(26, 26, 34, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .zoom-group button {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      font-size: 20px;
      color: var(--text);
      cursor: pointer;
    }
    .zoom-group button:hover { background: rgba(255,255,255,0.08); }
    .zoom-group button:first-child { border-bottom: 1px solid var(--border); }

    /* Leaflet dark tweaks */
    .leaflet-control-attribution {
      background: rgba(15,15,18,0.8) !important;
      color: var(--muted) !important;
      font-size: 11px !important;
    }
    .leaflet-control-attribution a { color: var(--accent); }
    .leaflet-popup-content-wrapper {
      background: #1a1a22;
      color: var(--text);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: #1a1a22; }
    .popup-title { font-weight: 500; font-size: 15px; margin-bottom: 4px; }
    .popup-coords { font-size: 12px; color: var(--muted); }
    .gpin { filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }

    @media (max-width: 480px) {
      .search-wrap { width: calc(100vw - 32px); top: 64px; }
      .layers-wrap { top: 64px; }
      .map-controls { bottom: 160px; }
      #controls { bottom: 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Status bar -->
  <div class="panel" id="status-bar">
    <div class="status-item">
      <div class="dot" id="net-dot"></div>
      <span id="net-status">Checking…</span>
    </div>
    <div class="status-item">
      <div class="dot" id="share-dot"></div>
      <span id="share-status">Not sharing</span>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input id="searchInput" type="text" placeholder="Search places" autocomplete="off" />
      <button class="icon-btn hidden" id="clearBtn" aria-label="Clear">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"></line>
          <line x1="18" y1="6" x2="6" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="results" id="results"></div>
  </div>

  <!-- Layers -->
  <div class="layers-wrap">
    <button class="layers-btn" id="layersBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <polygon points="12 3 22 8.5 12 14 2 8.5 12 3"></polygon>
        <polyline points="2 15.5 12 21 22 15.5"></polyline>
      </svg>
      <span>Layers</span>
    </button>
    <div class="layers-panel" id="layersPanel">
      <label><input type="radio" name="layer" value="dark" checked /> Dark</label>
      <label><input type="radio" name="layer" value="streets" /> Streets</label>
      <label><input type="radio" name="layer" value="satellite" /> Satellite</label>
    </div>
  </div>

  <!-- Zoom + locate -->
  <div class="map-controls">
    <button class="round-btn" id="locateBtn" title="Your location" aria-label="Your location">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"></circle>
        <circle cx="12" cy="12" r="8"></circle>
        <line x1="12" y1="1" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="23"></line>
        <line x1="1" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="23" y2="12"></line>
      </svg>
    </button>
    <div class="zoom-group">
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomOut" title="Zoom out">−</button>
    </div>
  </div>

  <!-- Sharing controls -->
  <div class="panel" id="controls">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <h1>Ghost Link</h1>
      <span class="demo-badge">DEMO MODE</span>
    </div>
    <div class="controls-row">
      <button id="btn-start" class="share-btn primary">Start Sharing</button>
      <button id="btn-pause" class="share-btn warning" disabled>Pause</button>
      <button id="btn-resume" class="share-btn primary" disabled>Resume</button>
      <button id="btn-stop" class="share-btn danger" disabled>Stop</button>
    </div>
    <div class="info">
      Simulated location updates while sharing is active.<br>
      Real GPS requires browser permission and is shown only when granted.
    </div>
    <div id="message"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Ghost Link — fully keyless map + location sharing
    const map = L.map('map', {
      center: [40.7128, -74.0060],
      zoom: 13,
      zoomControl: false,
      attributionControl: true
    });

    // Keyless layers
    const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 19,
      subdomains: 'abcd'
    });
    const streetsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 20,
      subdomains: 'abcd'
    });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 19
    });

    const baseLayers = { dark: darkLayer, streets: streetsLayer, satellite: satelliteLayer };
    darkLayer.addTo(map);

    // Custom pin icon (from provided code)
    const pinIcon = L.divIcon({
      className: 'gpin',
      html: `<svg width="28" height="40" viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.27 21.73 0 14 0z" fill="#6c5ce7"/>
        <circle cx="14" cy="14" r="5.5" fill="#fff"/>
      </svg>`,
      iconSize: [28, 40],
      iconAnchor: [14, 40],
      popupAnchor: [0, -34]
    });

    let searchMarker = null;
    let userMarker = L.circleMarker([40.7128, -74.0060], {
      radius: 10,
      fillColor: '#6c5ce7',
      color: '#fff',
      weight: 2,
      fillOpacity: 0.9
    }).addTo(map);
    userMarker.bindPopup('Your location').openPopup();

    function placeMarker(lat, lng, title, subtitle) {
      if (searchMarker) map.removeLayer(searchMarker);
      searchMarker = L.marker([lat, lng], { icon: pinIcon })
        .addTo(map)
        .bindPopup(`<div class="popup-title">${escapeHtml(title)}</div><div class="popup-coords">${escapeHtml(subtitle || '')}</div>`)
        .openPopup();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
    }

    // Search (Nominatim — keyless)
    const searchInput = document.getElementById('searchInput');
    const resultsEl = document.getElementById('results');
    const clearBtn = document.getElementById('clearBtn');
    let debounceTimer = null;
    let lastRequest = 0;

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim();
      clearBtn.classList.toggle('hidden', q.length === 0);
      clearTimeout(debounceTimer);
      if (q.length < 3) { closeResults(); return; }
      debounceTimer = setTimeout(() => runSearch(q), 420);
    });

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeResults(); searchInput.blur(); }
      if (e.key === 'Enter') {
        const first = resultsEl.querySelector('.result-item');
        if (first) first.click();
      }
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      closeResults();
      searchInput.focus();
    });

    async function runSearch(query) {
      const now = Date.now();
      if (now - lastRequest < 1000) return;
      lastRequest = now;
      resultsEl.innerHTML = '<div class="result-empty">Searching…</div>';
      resultsEl.classList.add('open');
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&q=' + encodeURIComponent(query), {
          headers: { Accept: 'application/json' }
        });
        const data = await res.json();
        renderResults(data);
      } catch (err) {
        resultsEl.innerHTML = '<div class="result-empty">Search unavailable. Check your connection.</div>';
        resultsEl.classList.add('open');
      }
    }

    function renderResults(data) {
      resultsEl.innerHTML = '';
      if (!data.length) {
        resultsEl.innerHTML = '<div class="result-empty">No results found</div>';
        resultsEl.classList.add('open');
        return;
      }
      data.forEach(place => {
        const parts = place.display_name.split(',');
        const title = parts[0].trim();
        const sub = parts.slice(1).join(',').trim();
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          <div><div class="result-title">${escapeHtml(title)}</div><div class="result-sub">${escapeHtml(sub)}</div></div>`;
        item.addEventListener('click', () => {
          const lat = parseFloat(place.lat);
          const lng = parseFloat(place.lon);
          map.flyTo([lat, lng], 16, { duration: 1.1 });
          placeMarker(lat, lng, title, sub);
          searchInput.value = title;
          closeResults();
        });
        resultsEl.appendChild(item);
      });
      resultsEl.classList.add('open');
    }

    function closeResults() { resultsEl.classList.remove('open'); }
    document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) closeResults(); });

    // Click map to drop pin
    map.on('click', e => {
      const { lat, lng } = e.latlng;
      placeMarker(lat, lng, 'Dropped pin', `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    });

    // Zoom controls
    document.getElementById('zoomIn').addEventListener('click', () => map.zoomIn());
    document.getElementById('zoomOut').addEventListener('click', () => map.zoomOut());

    // Layer switcher
    const layersBtn = document.getElementById('layersBtn');
    const layersPanel = document.getElementById('layersPanel');
    layersBtn.addEventListener('click', e => { e.stopPropagation(); layersPanel.classList.toggle('open'); });
    document.addEventListener('click', e => { if (!e.target.closest('.layers-wrap')) layersPanel.classList.remove('open'); });
    document.querySelectorAll('input[name="layer"]').forEach(radio => {
      radio.addEventListener('change', e => {
        Object.values(baseLayers).forEach(layer => map.removeLayer(layer));
        baseLayers[e.target.value].addTo(map);
        layersPanel.classList.remove('open');
      });
    });

    // Locate button
    document.getElementById('locateBtn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        setMessage('Geolocation is not supported by this browser.', 'error');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          map.flyTo([lat, lng], 16, { duration: 1.2 });
          moveUserMarker(lat, lng);
          setMessage('Centered on your location.', 'success');
        },
        () => setMessage('Unable to get your location. Permission may have been denied.', 'error'),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    // Ghost Link location sharing logic
    let watchId = null;
    let simInterval = null;
    let sharing = false;
    let paused = false;
    let currentLat = 40.7128;
    let currentLng = -74.0060;
    let useRealGPS = false;

    const netDot = document.getElementById('net-dot');
    const netStatus = document.getElementById('net-status');
    const shareDot = document.getElementById('share-dot');
    const shareStatus = document.getElementById('share-status');
    const messageEl = document.getElementById('message');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');
    const btnStop = document.getElementById('btn-stop');

    function setMessage(text, type = 'info') {
      messageEl.textContent = text;
      messageEl.style.color = type === 'error' ? 'var(--danger)' : type === 'success' ? 'var(--success)' : 'var(--warning)';
    }

    function updateNetworkStatus() {
      if (navigator.onLine) {
        netDot.className = 'dot online';
        netStatus.textContent = 'Online';
      } else {
        netDot.className = 'dot error';
        netStatus.textContent = 'Offline';
        setMessage('You are offline. Location updates may fail.', 'error');
      }
    }
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);
    updateNetworkStatus();

    function updateShareUI() {
      if (!sharing) {
        shareDot.className = 'dot';
        shareStatus.textContent = 'Not sharing';
        btnStart.disabled = false;
        btnPause.disabled = true;
        btnResume.disabled = true;
        btnStop.disabled = true;
      } else if (paused) {
        shareDot.className = 'dot paused';
        shareStatus.textContent = 'Paused';
        btnStart.disabled = true;
        btnPause.disabled = true;
        btnResume.disabled = false;
        btnStop.disabled = false;
      } else {
        shareDot.className = 'dot sharing';
        shareStatus.textContent = useRealGPS ? 'Sharing (GPS)' : 'Sharing (Demo)';
        btnStart.disabled = true;
        btnPause.disabled = false;
        btnResume.disabled = true;
        btnStop.disabled = false;
      }
    }

    function moveUserMarker(lat, lng) {
      currentLat = lat;
      currentLng = lng;
      userMarker.setLatLng([lat, lng]);
    }

    function startSimulation() {
      if (simInterval) clearInterval(simInterval);
      simInterval = setInterval(() => {
        if (!sharing || paused) return;
        currentLat += (Math.random() - 0.5) * 0.002;
        currentLng += (Math.random() - 0.5) * 0.002;
        moveUserMarker(currentLat, currentLng);
        map.panTo([currentLat, currentLng], { animate: true });
      }, 2000);
    }

    function stopSimulation() {
      if (simInterval) { clearInterval(simInterval); simInterval = null; }
    }

    function startRealGPS() {
      if (!navigator.geolocation) {
        setMessage('Geolocation is not supported by this browser.', 'error');
        return false;
      }
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          if (!sharing || paused) return;
          useRealGPS = true;
          moveUserMarker(pos.coords.latitude, pos.coords.longitude);
          map.panTo([pos.coords.latitude, pos.coords.longitude], { animate: true });
          setMessage('Using real GPS location.', 'success');
          updateShareUI();
        },
        (err) => {
          setMessage('GPS error: ' + err.message + '. Falling back to demo.', 'error');
          useRealGPS = false;
          startSimulation();
          updateShareUI();
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
      );
      return true;
    }

    function stopRealGPS() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      useRealGPS = false;
    }

    btnStart.addEventListener('click', () => {
      sharing = true;
      paused = false;
      setMessage('Starting location sharing…');
      const started = startRealGPS();
      if (!started) {
        startSimulation();
        setMessage('Demo mode: simulated movement active.', 'success');
      }
      updateShareUI();
    });

    btnPause.addEventListener('click', () => {
      paused = true;
      stopSimulation();
      setMessage('Sharing paused. Your location is not being updated.');
      updateShareUI();
    });

    btnResume.addEventListener('click', () => {
      paused = false;
      if (!useRealGPS) startSimulation();
      setMessage('Sharing resumed.');
      updateShareUI();
    });

    btnStop.addEventListener('click', () => {
      sharing = false;
      paused = false;
      stopSimulation();
      stopRealGPS();
      setMessage('Sharing stopped. Location is no longer being updated.');
      updateShareUI();
    });

    updateShareUI();
    setMessage('Ready. Search places or click Start Sharing.');

    // Initial center attempt
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          moveUserMarker(pos.coords.latitude, pos.coords.longitude);
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
        },
        () => {},
        { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
      );
    }
  </script>
</body>
</html>
