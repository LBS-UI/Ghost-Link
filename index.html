<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghost Link — Location Sharing</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #1a1a22;
      --border: #2e2e3a;
      --text: #e8e8f0;
      --muted: #8a8a9a;
      --accent: #6c5ce7;
      --accent-hover: #7d6ff0;
      --success: #00d26a;
      --warning: #ffb800;
      --danger: #ff4757;
      --sharing: #00b4d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 1; }
    .panel {
      position: absolute;
      z-index: 10;
      background: rgba(26, 26, 34, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #controls {
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(420px, calc(100% - 32px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #status-bar {
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15,15,18,0.7);
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.sharing { background: var(--sharing); box-shadow: 0 0 8px var(--sharing); animation: pulse 1.5s infinite; }
    .dot.paused { background: var(--warning); }
    .dot.error { background: var(--danger); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 90px;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:hover { background: #252530; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: white; border-color: transparent; }
    button.primary:hover { background: var(--accent-hover); }
    button.danger { background: var(--danger); color: white; border-color: transparent; }
    button.warning { background: var(--warning); color: #111; border-color: transparent; }
    .info {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }
    .demo-badge {
      display: inline-block;
      background: #2a1f3d;
      color: #c5a3ff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 6px;
      font-weight: 600;
    }
    #message {
      min-height: 20px;
      font-size: 13px;
      text-align: center;
      color: var(--warning);
    }
    @media (max-width: 480px) {
      #controls { bottom: 12px; padding: 12px; }
      button { padding: 10px 12px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel" id="status-bar">
    <div class="status-item">
      <div class="dot" id="net-dot"></div>
      <span id="net-status">Checking…</span>
    </div>
    <div class="status-item">
      <div class="dot" id="share-dot"></div>
      <span id="share-status">Not sharing</span>
    </div>
  </div>

  <div class="panel" id="controls">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <h1>Ghost Link</h1>
      <span class="demo-badge">DEMO MODE</span>
    </div>
    <div class="controls-row">
      <button id="btn-start" class="primary">Start Sharing</button>
      <button id="btn-pause" class="warning" disabled>Pause</button>
      <button id="btn-resume" class="primary" disabled>Resume</button>
      <button id="btn-stop" class="danger" disabled>Stop</button>
    </div>
    <div class="info">
      Simulated location updates while sharing is active.<br>
      Real GPS requires browser permission and is shown only when granted.
    </div>
    <div id="message"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Ghost Link — Demo frontend (no backend required for basic use)
    // Fully keyless map — no API keys, tokens, or paid services required.

    const map = L.map('map', { zoomControl: false }).setView([40.7128, -74.0060], 13);

    // Keyless dark layer (Carto Dark Matter — OSM-compatible, no API key)
    // Attribution required. Suitable for moderate public use; see Carto terms for high-volume production.
    const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxZoom: 19,
      subdomains: 'abcd'
    });

    // Keyless standard OpenStreetMap tiles (fallback / alternative)
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    });

    // Keyless satellite layer (Esri World Imagery — no API key)
    const satelliteLayer = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
        maxZoom: 19
      }
    );

    // Add dark layer by default (matches Ghost Link UI)
    darkLayer.addTo(map);

    // Layer control — all keyless options
    const baseLayers = {
      'Dark': darkLayer,
      'Standard': osmLayer,
      'Satellite': satelliteLayer
    };
    L.control.layers(baseLayers, null, { position: 'topright', collapsed: true }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Simple tile-error handling
    darkLayer.on('tileerror', function() {
      console.warn('Dark tiles failed to load — switching to standard OSM as fallback');
      if (map.hasLayer(darkLayer)) {
        map.removeLayer(darkLayer);
        osmLayer.addTo(map);
      }
    });

    let marker = L.circleMarker([40.7128, -74.0060], {
      radius: 10,
      fillColor: '#6c5ce7',
      color: '#fff',
      weight: 2,
      fillOpacity: 0.9
    }).addTo(map);
    marker.bindPopup('Your location').openPopup();

    let watchId = null;
    let simInterval = null;
    let sharing = false;
    let paused = false;
    let currentLat = 40.7128;
    let currentLng = -74.0060;
    let useRealGPS = false;

    const netDot = document.getElementById('net-dot');
    const netStatus = document.getElementById('net-status');
    const shareDot = document.getElementById('share-dot');
    const shareStatus = document.getElementById('share-status');
    const messageEl = document.getElementById('message');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');
    const btnStop = document.getElementById('btn-stop');

    function setMessage(text, type = 'info') {
      messageEl.textContent = text;
      messageEl.style.color = type === 'error' ? 'var(--danger)' : type === 'success' ? 'var(--success)' : 'var(--warning)';
    }

    function updateNetworkStatus() {
      if (navigator.onLine) {
        netDot.className = 'dot online';
        netStatus.textContent = 'Online';
      } else {
        netDot.className = 'dot error';
        netStatus.textContent = 'Offline';
        setMessage('You are offline. Location updates may fail.', 'error');
      }
    }
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);
    updateNetworkStatus();

    function updateShareUI() {
      if (!sharing) {
        shareDot.className = 'dot';
        shareStatus.textContent = 'Not sharing';
        btnStart.disabled = false;
        btnPause.disabled = true;
        btnResume.disabled = true;
        btnStop.disabled = true;
      } else if (paused) {
        shareDot.className = 'dot paused';
        shareStatus.textContent = 'Paused';
        btnStart.disabled = true;
        btnPause.disabled = true;
        btnResume.disabled = false;
        btnStop.disabled = false;
      } else {
        shareDot.className = 'dot sharing';
        shareStatus.textContent = useRealGPS ? 'Sharing (GPS)' : 'Sharing (Demo)';
        btnStart.disabled = true;
        btnPause.disabled = false;
        btnResume.disabled = true;
        btnStop.disabled = false;
      }
    }

    function moveMarker(lat, lng) {
      currentLat = lat;
      currentLng = lng;
      marker.setLatLng([lat, lng]);
      map.panTo([lat, lng], { animate: true });
    }

    function startSimulation() {
      if (simInterval) clearInterval(simInterval);
      simInterval = setInterval(() => {
        if (!sharing || paused) return;
        // Gentle random walk simulation
        currentLat += (Math.random() - 0.5) * 0.002;
        currentLng += (Math.random() - 0.5) * 0.002;
        moveMarker(currentLat, currentLng);
      }, 2000);
    }

    function stopSimulation() {
      if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
      }
    }

    function startRealGPS() {
      if (!navigator.geolocation) {
        setMessage('Geolocation is not supported by this browser.', 'error');
        return false;
      }
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          if (!sharing || paused) return;
          useRealGPS = true;
          moveMarker(pos.coords.latitude, pos.coords.longitude);
          setMessage('Using real GPS location.', 'success');
          updateShareUI();
        },
        (err) => {
          setMessage('GPS error: ' + err.message + '. Falling back to demo.', 'error');
          useRealGPS = false;
          startSimulation();
          updateShareUI();
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
      );
      return true;
    }

    function stopRealGPS() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      useRealGPS = false;
    }

    btnStart.addEventListener('click', () => {
      sharing = true;
      paused = false;
      setMessage('Starting location sharing…');
      // Prefer real GPS if user grants permission; otherwise demo
      const started = startRealGPS();
      if (!started) {
        startSimulation();
        setMessage('Demo mode: simulated movement active.', 'success');
      }
      updateShareUI();
    });

    btnPause.addEventListener('click', () => {
      paused = true;
      stopSimulation();
      setMessage('Sharing paused. Your location is not being updated.');
      updateShareUI();
    });

    btnResume.addEventListener('click', () => {
      paused = false;
      if (useRealGPS) {
        // watchPosition is still active
      } else {
        startSimulation();
      }
      setMessage('Sharing resumed.');
      updateShareUI();
    });

    btnStop.addEventListener('click', () => {
      sharing = false;
      paused = false;
      stopSimulation();
      stopRealGPS();
      setMessage('Sharing stopped. Location is no longer being updated.');
      updateShareUI();
    });

    // Initial state
    updateShareUI();
    setMessage('Ready. Click Start Sharing to begin (demo or GPS).');

    // Center on user roughly if possible (one-time, non-watching)
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          moveMarker(pos.coords.latitude, pos.coords.longitude);
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
        },
        () => { /* ignore, stay on default */ },
        { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
      );
    }
  </script>
</body>
</html>
